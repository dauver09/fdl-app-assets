
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>FDL</title>

  <!-- iPhone Home Screen settings -->
  <meta name="apple-mobile-web-app-capable"
        content="yes">
  <meta name="apple-mobile-web-app-title"
        content="FDL">
  <meta name="apple-mobile-web-app-status-bar-style"
        content="black">
  <meta name="theme-color" content="#080c13">

  <!-- Florida Sunset FDL icon -->
  <link rel="apple-touch-icon"
        href="./FDL_Florida_Sunset_Icon.png">

  <link rel="manifest"
        href="./manifest.webmanifest">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(
        145deg, #080c13, #17132a, #080c13
      );
      color: #f5f7fb;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    .logo {
      width: 160px;
      height: 160px;
      object-fit: contain;
      border-radius: 32px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 30px;
      margin: 0 0 8px;
    }

    p {
      color: #aebed0;
      margin-bottom: 30px;
    }

    .button {
      display: block;
      padding: 17px 24px;
      background: #ff791b;
      color: #080c13;
      text-decoration: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
    }

    .button:active {
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <main class="container">

    <img
      class="logo"
      src="./FDL_Florida_Sunset_Icon.png"
      alt="Florida Draft League Logo">

    <h1>Florida Draft League</h1>

    <p>Season 7 League Hub</p>

    <a
      class="button"
      href="https://script.google.com/macros/s/AKfycbzLU6stFUmbDTQya27qlKQA_nMtmtDFQJAGUhvuClVS5qUHtwV1tUaRHSXX4gtW_fbpNg/exec">
      Open League Hub
    </a>

  </main>
</body>
</html>
